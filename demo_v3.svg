    <!-- 나무결 패턴 (거실/침실) -->
    <pattern id="pat-wood" width="20" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="20" height="6" fill="#D4A574"/>
      <line x1="0" y1="1" x2="20" y2="1" stroke="#C89B68" stroke-width="0.3" opacity="0.5"/>
