<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Architect — 건축 도면 자동 생성</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a237e, #283593);
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header span { font-size: 14px; opacity: 0.8; }

    /* Layout */
    .container {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 80px);
    }

    /* Sidebar */
    .sidebar {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      height: fit-content;
    }
    .sidebar h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1a237e;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #3f51b5;
    }
    .form-group textarea {
      height: 80px;
      resize: vertical;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-generate {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3f51b5, #5c6bc0);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-download {
      width: 100%;
      padding: 10px;
      background: white;
      color: #3f51b5;
      border: 1.5px solid #3f51b5;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-download:hover {
      background: #3f51b5;
      color: white;
    }

    .btn-example {
      padding: 4px 10px;
      background: #f5f7fa;
      color: #555;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      margin-right: 4px;
      margin-bottom: 4px;
      transition: all 0.2s;
    }
    .btn-example:hover {
      background: #e8eaf6;
      border-color: #3f51b5;
      color: #3f51b5;
    }

    /* Main area */
    .main {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .main h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1a237e;
    }

    .preview-area {
      flex: 1;
      background: #fafafa;
      border: 1px dashed #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      overflow: auto;
      padding: 16px;
    }
    .preview-area.has-svg {
      border-style: solid;
      border-color: #e0e0e0;
    }
    .preview-area svg {
      max-width: 100%;
      height: auto;
    }

    .placeholder {
      text-align: center;
      color: #aaa;
    }
    .placeholder .icon { font-size: 48px; margin-bottom: 12px; }
    .placeholder p { font-size: 14px; }

    /* Info bar */
    .info-bar {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      padding: 12px 16px;
      background: #f5f7fa;
      border-radius: 8px;
      font-size: 13px;
      color: #666;
    }
    .info-item { display: flex; align-items: center; gap: 4px; }
    .info-item strong { color: #333; }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .loading.active { display: block; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #eee;
      border-top-color: #3f51b5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error {
      display: none;
      padding: 12px 16px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
    }
    .error.active { display: block; }

    /* Responsive */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏗️ AI Architect</h1>
    <span>— 건축 도면 자동 생성 (PoC v0.1)</span>
  </div>

  <div class="container">
    <!-- Sidebar: Input Form -->
    <div class="sidebar">
      <h2>📐 대지 정보 입력</h2>

      <div class="form-row">
        <div class="form-group">
          <label>대지 가로 (m)</label>
          <input type="number" id="landWidth" value="15" min="5" max="100" step="0.5">
        </div>
        <div class="form-group">
          <label>대지 세로 (m)</label>
          <input type="number" id="landHeight" value="20" min="5" max="100" step="0.5">
        </div>
      </div>

      <div class="form-group">
        <label>방향</label>
        <select id="direction">
          <option value="south">남향</option>
          <option value="east">동향</option>
          <option value="west">서향</option>
          <option value="north">북향</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>방 수</label>
          <select id="roomCount">
            <option value="1">1개</option>
            <option value="2" selected>2개</option>
            <option value="3">3개</option>
            <option value="4">4개</option>
            <option value="5">5개</option>
          </select>
        </div>
        <div class="form-group">
          <label>욕실 수</label>
          <select id="bathroomCount">
            <option value="1" selected>1개</option>
            <option value="2">2개</option>
            <option value="3">3개</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>요구사항 (자유 입력)</label>
        <textarea id="requirements" placeholder="예: 거실+다이닝 넓게, 안방 큰 거 하나, 작은 방 2개, 욕실 2개, 현관에서 복도로 연결, 주방은 거실과 오픈형"></textarea>
        <div style="margin-top: 6px;">
          <button class="btn-example" onclick="loadExample(1)">📋 예시 1: 3인 가족</button>
          <button class="btn-example" onclick="loadExample(2)">📋 예시 2: 신혼부부</button>
          <button class="btn-example" onclick="loadExample(3)">📋 예시 3: 4인 가족</button>
        </div>
      </div>

      <button class="btn-generate" id="btnGenerate" onclick="generate()">
        🏗️ 도면 생성
      </button>

      <div class="error" id="errorMsg"></div>

      <button class="btn-download" id="btnDownload" onclick="downloadSVG()" style="display:none">
        📥 SVG 다운로드
      </button>
    </div>

    <!-- Main: Preview -->
    <div class="main">
      <h2>📋 도면 미리보기</h2>

      <div class="preview-area" id="previewArea">
        <div class="placeholder" id="placeholder">
          <div class="icon">🏠</div>
          <p>대지 정보를 입력하고<br>"도면 생성" 버튼을 눌러주세요</p>
        </div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>도면 생성 중...</p>
        </div>
      </div>

      <div class="info-bar" id="infoBar" style="display:none">
        <div class="info-item">🏗️ 건축면적: <strong id="infoBuildArea">-</strong></div>
        <div class="info-item">📊 건폐율: <strong id="infoCoverage">-</strong></div>
        <div class="info-item">🏠 방 수: <strong id="infoRooms">-</strong></div>
        <div class="info-item">⏱️ 생성 시간: <strong id="infoTime">-</strong></div>
      </div>
    </div>
  </div>

  <script>
    // API endpoint — 백엔드 서버
    const API_URL = 'http://localhost:3001';

    // 예시 데이터
    const EXAMPLES = {
      1: {
        name: '3인 가족 단독주택',
        landWidth: 15, landHeight: 20, direction: 'south', roomCount: '3', bathroomCount: '2',
        requirements: '거실+다이닝 넓게 20평 이상, 안방 큰 거 하나(드레스룸 포함), 작은 방 2개, 욕실 2개(안방 전용 1개), 현관에서 복도로 연결, 주방은 거실과 오픈형, 남향 채광 중요'
      },
      2: {
        name: '신혼부부 소형주택',
        landWidth: 10, landHeight: 12, direction: 'south', roomCount: '1', bathroomCount: '1',
        requirements: '거실+주방 오픈형으로 넓게, 안방 1개(넉넉하게), 욕실 1개, 현관 수납공간, 발코니 있으면 좋겠음, 심플하고 효율적인 구조'
      },
      3: {
        name: '4인 가족 넓은 주택',
        landWidth: 20, landHeight: 25, direction: 'south', roomCount: '4', bathroomCount: '2',
        requirements: '거실 30평 이상 넓게, 안방(드레스룸+욕실 포함), 자녀방 2개(각 10평), 서재 1개, 욕실 2개, 주방+식당 분리, 현관 넓게, 남향 거실 필수, 동선 효율적으로'
      }
    };

    function loadExample(num) {
      const ex = EXAMPLES[num];
      if (!ex) return;
      document.getElementById('landWidth').value = ex.landWidth;
      document.getElementById('landHeight').value = ex.landHeight;
      document.getElementById('direction').value = ex.direction;
      document.getElementById('roomCount').value = ex.roomCount;
      document.getElementById('bathroomCount').value = ex.bathroomCount;
      document.getElementById('requirements').value = ex.requirements;
    }

    let currentSVG = null;

    async function generate() {
      const btn = document.getElementById('btnGenerate');
      const loading = document.getElementById('loading');
      const placeholder = document.getElementById('placeholder');
      const preview = document.getElementById('previewArea');
      const errorEl = document.getElementById('errorMsg');
      const infoBar = document.getElementById('infoBar');
      const downloadBtn = document.getElementById('btnDownload');

      // Get values
      const landWidth = parseFloat(document.getElementById('landWidth').value);
      const landHeight = parseFloat(document.getElementById('landHeight').value);
      const direction = document.getElementById('direction').value;
      const roomCount = document.getElementById('roomCount').value;
      const bathroomCount = document.getElementById('bathroomCount').value;
      const rawReq = document.getElementById('requirements').value;
      const requirements = `방 ${roomCount}개, 욕실 ${bathroomCount}개${rawReq ? ', ' + rawReq : ''}`;

      // Validate
      if (!landWidth || !landHeight || landWidth < 5 || landHeight < 5) {
        errorEl.textContent = '대지 크기는 최소 5m × 5m 이상이어야 합니다.';
        errorEl.classList.add('active');
        return;
      }

      // UI state: loading
      errorEl.classList.remove('active');
      btn.disabled = true;
      btn.textContent = '⏳ 생성 중...';
      placeholder.style.display = 'none';
      loading.classList.add('active');
      downloadBtn.style.display = 'none';
      infoBar.style.display = 'none';

      const startTime = performance.now();

      try {
        const res = await fetch(`${API_URL}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ landWidth, landHeight, direction, requirements }),
        });

        const data = await res.json();
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);

        if (!data.success) {
          throw new Error(data.error || '도면 생성에 실패했습니다.');
        }

        // Render SVG
        currentSVG = data.svg;
        loading.classList.remove('active');
        preview.classList.add('has-svg');

        // Remove placeholder/loading, insert SVG
        const svgContainer = document.createElement('div');
        svgContainer.innerHTML = data.svg;
        // Clear previous SVG
        const oldSvg = preview.querySelector('.svg-output');
        if (oldSvg) oldSvg.remove();
        svgContainer.className = 'svg-output';
        preview.appendChild(svgContainer);

        // Info bar
        const plan = data.floorPlan;
        document.getElementById('infoBuildArea').textContent = plan.metadata.buildingArea + '㎡';
        document.getElementById('infoCoverage').textContent = plan.metadata.coverageRatio + '%';
        document.getElementById('infoRooms').textContent = plan.rooms.length + '개';
        document.getElementById('infoTime').textContent = elapsed + '초';
        infoBar.style.display = 'flex';
        downloadBtn.style.display = 'block';

      } catch (err) {
        loading.classList.remove('active');
        placeholder.style.display = 'block';
        errorEl.textContent = err.message;
        errorEl.classList.add('active');
      } finally {
        btn.disabled = false;
        btn.textContent = '🏗️ 도면 생성';
      }
    }

    function downloadSVG() {
      if (!currentSVG) return;
      const blob = new Blob([currentSVG], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'floorplan.svg';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
